name: Publish HyperMusic Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-hypermusic
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      REPOSITORY: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release notes and inspect existing release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          channel=$(node scripts/release.mjs notes "$TAG" "$RUNNER_TEMP/notes.md")
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          gh api --paginate --slurp "repos/$REPOSITORY/releases?per_page=100" |
            jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | if length > 1 then error("Duplicate release tag") else .[0] end' > "$RUNNER_TEMP/release.json"
          mkdir -p "$RUNNER_TEMP/apk"
          count=$(jq '.assets | length' "$RUNNER_TEMP/release.json")
          if [[ "$count" == 0 ]]; then
            jq -e '. == null or .draft == true' "$RUNNER_TEMP/release.json" > /dev/null
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            jq -e --arg name "HyperMusic-${TAG#v}.apk" '.assets | length == 1 and .[0].name == $name and .[0].state == "uploaded"' "$RUNNER_TEMP/release.json" > /dev/null
            gh release download "$TAG" --pattern "HyperMusic-${TAG#v}.apk" --dir "$RUNNER_TEMP/apk"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.prepare.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@v3

      - name: Decode release keystore
        if: steps.prepare.outputs.build == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/hypermusic-release.keystore

      - name: Assemble signed release APK
        if: steps.prepare.outputs.build == 'true'
        env:
          HYPERMUSIC_KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          HYPERMUSIC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          HYPERMUSIC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          bash ./gradlew :app:assembleRelease --no-daemon
          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk')
          [[ "${#apks[@]}" -eq 1 && "${apks[0]}" == app/build/outputs/apk/release/app-release.apk ]]
          cp "${apks[0]}" "$RUNNER_TEMP/apk/HyperMusic-${TAG#v}.apk"

      - name: Verify signature and APK metadata
        run: |
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          if [[ ! -x "$build_tools/aapt2" ]]; then
            sdkmanager "build-tools;35.0.0"
          fi
          apk="$RUNNER_TEMP/apk/HyperMusic-${TAG#v}.apk"
          "$build_tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signing"

      - name: Publish verified APK and update release feed
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.prepare.outputs.channel }}
          BUILD_APK: ${{ steps.prepare.outputs.build }}
        run: |
          release="$RUNNER_TEMP/release.json"
          apk="$RUNNER_TEMP/apk/HyperMusic-${TAG#v}.apk"
          if jq -e '. == null' "$release" > /dev/null; then
            prerelease=()
            if [[ "$CHANNEL" == "preview" ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" --verify-tag --draft --title "HyperMusic $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
            gh api --paginate --slurp "repos/$REPOSITORY/releases?per_page=100" |
              jq -e --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | if length == 1 then .[0] else error("Expected one draft") end' > "$release"
          fi
          id=$(jq -er '.id' "$release")
          if [[ "$BUILD_APK" == true ]]; then
            gh release upload "$TAG" "$apk"
          fi
          gh api "repos/$REPOSITORY/releases/$id" > "$release"

          git fetch origin main
          git worktree add --detach "$RUNNER_TEMP/feed" FETCH_HEAD
          feed="$RUNNER_TEMP/feed/public/releases.json"
          args=(record "$TAG" "$REPOSITORY" "$apk" "$RUNNER_TEMP/badging" "$RUNNER_TEMP/signing" "$release" "$feed")
          node scripts/release.mjs "${args[@]}" --check
          if jq -e '.draft' "$release" > /dev/null; then
            gh api --method PATCH "repos/$REPOSITORY/releases/$id" -F draft=false > "$release"
          fi
          node scripts/release.mjs "${args[@]}"

          cd "$RUNNER_TEMP/feed"
          if ! git diff --quiet -- public/releases.json; then
            git add public/releases.json
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Publish HyperMusic $TAG release metadata"
            git push origin HEAD:main
          fi
          gh workflow run web-ci.yml --ref main
